name: ip-ranges-refresh

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (action fails if both are set)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm refresh:ip-ranges
      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/ip-ranges-refresh
          commit-message: "chore(data): refresh IP-range bundles"
          title: "chore(data): refresh IP-range bundles"
          body: |
            Automated weekly refresh of bundled CDN / cloud provider CIDR lists.
            Sources: Cloudflare, AWS, Fastly, GCP.
          delete-branch: true
