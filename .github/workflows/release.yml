name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, bun_target: bun-linux-x64, artifact: poirot-linux-x64 }
          - { os: ubuntu-latest, bun_target: bun-linux-arm64, artifact: poirot-linux-arm64 }
          - { os: macos-latest, bun_target: bun-darwin-x64, artifact: poirot-darwin-x64 }
          - { os: macos-latest, bun_target: bun-darwin-arm64, artifact: poirot-darwin-arm64 }
          - { os: windows-latest, bun_target: bun-windows-x64, artifact: poirot-windows-x64.exe }
    runs-on: ${{ matrix.target.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      # pnpm version comes from package.json "packageManager" (action fails if both are set)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: sigstore/cosign-installer@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build binary
        shell: bash
        run: |
          bun build ./packages/cli/src/bin.ts \
            --compile \
            --target=${{ matrix.target.bun_target }} \
            --outfile=${{ matrix.target.artifact }}
      - name: SHA256
        shell: bash
        # sha256sum: Linux and Git Bash on Windows; shasum: macOS. Same "<hash>  <file>" format.
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.target.artifact }} > ${{ matrix.target.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.target.artifact }} > ${{ matrix.target.artifact }}.sha256
          fi
          cat ${{ matrix.target.artifact }}.sha256
      - name: Sign binary with Sigstore cosign (keyless)
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle ${{ matrix.target.artifact }}.sigstore \
            ${{ matrix.target.artifact }}
          cosign sign-blob \
            --output-signature ${{ matrix.target.artifact }}.sig \
            --output-certificate ${{ matrix.target.artifact }}.crt \
            ${{ matrix.target.artifact }}
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.target.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: |
            ${{ matrix.target.artifact }}
            ${{ matrix.target.artifact }}.sha256
            ${{ matrix.target.artifact }}.sig
            ${{ matrix.target.artifact }}.crt
            ${{ matrix.target.artifact }}.sigstore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Verifying this release

            With cosign:
            ```sh
            cosign verify-blob \
              --bundle poirot-<os>-<arch>.sigstore \
              --certificate-identity-regexp 'https://github.com/sladjanstojcic/poirot/.github/workflows/release.yml@.*' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              poirot-<os>-<arch>
            ```

            With GitHub CLI attestations:
            ```sh
            gh attestation verify poirot-<os>-<arch> --owner sladjanstojcic
            ```

            SHA256 only:
            ```sh
            shasum -a 256 -c poirot-<os>-<arch>.sha256
            ```
